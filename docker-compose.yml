services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGO_URI: mongodb://mongo:27017/hiresense
      REDIS_URL: redis://redis:6379
      QUEUE_INLINE: "false"
      CLIENT_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_SECRET: dev_access_secret_change_me
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_SECRET: dev_refresh_secret_change_me
      REFRESH_TOKEN_EXPIRY: 7d
      PURGE_RECORDINGS: "false"
    depends_on:
      - mongo
      - redis

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
